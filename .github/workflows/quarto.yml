name: Quarto Render

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Quarto with TinyTeX: the render includes cv/full-cv.qmd and
      # cv/resume.qmd, which need LaTeX for the PDFs. (No R needed — zero R
      # chunks site-wide; quarto-cv is lualatex-only.)
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render site
        run: quarto render

      # Screenshot + smoke guard: renders key routes headless, asserts the
      # chrome exists (toggler glyph, skip link, palette picker), and saves
      # screenshots as an artifact.
      - name: Screenshot check
        run: |
          npm install
          npx playwright install --with-deps chromium
          python3 -m http.server 4200 --directory _site &
          sleep 2
          node scripts/screenshot-check.mjs http://localhost:4200 ./screenshot-check-out
        continue-on-error: true # visual regression guard: warn, don't block deploy

      - name: Upload screenshots (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshot-check-out/
          if-no-files-found: ignore

      - name: Upload artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          if-no-files-found: ignore
