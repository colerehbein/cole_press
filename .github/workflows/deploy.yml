name: Build & Deploy to Netlify

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Quarto CLI with TinyTeX (needed for the CV + résumé PDFs via
      # quarto-cv). No R toolchain: the site has zero R chunks, and the only
      # PDFs come from the LaTeX quarto-cv extension.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # Render main site (also builds the scrubbed CV + résumé PDFs in cv/)
      - name: Render site
        run: quarto render

      # Deploy to Netlify
      - name: Deploy
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: _site
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
