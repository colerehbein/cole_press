<!-- Rotating "Currently" line on the home page sidebar: cycles through a few
     short-lived facts (building / listening / thinking / sitting) so the
     sidebar feels lived-in. Advances on click, Enter, or Space only; there is
     no timer, so nothing moves under the reader and no pause control is
     needed (WCAG 2.2.2). Falls back to the static list if JS is off. -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  var list = document.querySelector(".home-sidebar .changelog-list");
  if (!list) return;

  var items = [
    ["Building", "reproducible R tools for behavioral-health research"],
    ["Listening", "whatever the desert recommends"],
    ["Thinking", "about measurement, mostly"],
    ["Sitting", "zazen, Sōtō Zen. A student, not a teacher"]
  ];

  var li = document.createElement("li");
  li.className = "changelog-entry";
  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "changelog-rotate";
  btn.title = "Show another line";
  btn.innerHTML = '<span class="changelog-date"></span><span class="changelog-desc"></span>';
  li.appendChild(btn);
  list.appendChild(li);

  var date = btn.querySelector(".changelog-date");
  var desc = btn.querySelector(".changelog-desc");
  var i = 0;

  function show() {
    date.textContent = items[i][0];
    desc.textContent = items[i][1];
    i = (i + 1) % items.length;
  }

  show();
  btn.addEventListener("click", show);
});
</script>
