project:
  type: website
  title: "cole.press"
  resources:
    - fonts/
    - favicon.svg
  render:
    - "*.qmd"
    - "!AGENTS.md"
    - "!CLAUDE.md"
    - "!CONTRIBUTING.md"
    - "!README.md"

website:
  title: "cole.press"
  description: "Cole Rehbein — crisis counselor and clinical psychology researcher building reproducible tools for behavioral-health research, communication, and care."
  site-url: "https://cole.press"
  repo-url: "https://github.com/colerehbein/cole_press"
  favicon: favicon.svg
  search: true
  open-graph:
    image: og-image.png
  twitter-card:
    card-style: summary_large_image
    creator: "@colerehbein"
    site: "@colerehbein"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: /blog/
        text: Blog
      - href: projects.qmd
        text: Projects
      - href: /cv/
        text: CV
    right:
      - icon: fab fa-github
        href: https://github.com/colerehbein
        aria-label: "GitHub"
      - icon: fab fa-x-twitter
        href: https://x.com/colerehbein
        aria-label: "X (Twitter)"

format:
  html:
    theme:
      light: monospatial-light.scss
      dark: monospatial-dark.scss
    respect-user-color-scheme: true
    toc: true
    include-in-header:
      - _includes/preload-fonts.html
      - _includes/terminal-theme.html
    code-fold: true
    code-summary: "Show code"
    code-tools:
      source: repo
    execute:
      cache: true
      echo: true
      warning: false
    highlight-style:
      light: github
      dark: monokai
    html-math-method: katex
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 250px

params:
  author: "Cole Rehbein"
  date_format: "MMM D, YYYY"

editor: visual
