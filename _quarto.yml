project:
  type: website
  title: "cole.press"
  resources:
    - fonts/
    - favicon.svg
    - portfolio/photos/
  render:
    - "*.qmd"
    - "!AGENTS.md"
    - "!CLAUDE.md"
    - "!CONTRIBUTING.md"
    - "!README.md"

website:
  title: "cole.press"
  description: "Crisis counselor on the 988 Suicide & Crisis Lifeline network and clinical psychology researcher. Essays, research, and tools for behavioral health."
  site-url: "https://cole.press"
  repo-url: "https://github.com/colerehbein/cole_press"
  favicon: favicon.svg
  search: true
  open-graph:
    image: og-image.png
  twitter-card:
    card-style: summary_large_image
    creator: "@colerehbein"
    site: "@colerehbein"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - text: Research
        menu:
          - href: research.qmd
            text: Research
          - href: projects.qmd
            text: Projects
      - href: /blog/
        text: Blog
      - text: Portfolio
        menu:
          - text: Overview
            href: portfolio/index.qmd
          - text: Photos
            href: portfolio/photos.qmd
          - text: Writing
            href: portfolio/writing.qmd
      - href: /cv/
        text: CV
    right:
      - href: https://github.com/colerehbein
        text: GitHub
        aria-label: "GitHub"
      - href: https://x.com/colerehbein
        text: X
        aria-label: "X (Twitter)"

  page-footer:
    left: "© 2026 Cole Rehbein — crisis counselor & clinical psychology researcher"
    center: "In crisis? Call or text 988 — Suicide & Crisis Lifeline"
    right: "[GitHub](https://github.com/colerehbein) · [X](https://x.com/colerehbein) · [RSS](/blog/index.xml)"

format:
  html:
    theme:
      light: brutalist-light.scss
      dark: brutalist-dark.scss
    respect-user-color-scheme: true
    toc: true
    include-in-header:
      - _includes/preload-fonts.html
      - _includes/accent-palette.html
      - _includes/portfolio-nav.html
    execute:
      cache: true
      echo: true
      warning: false
    highlight-style:
      light: github
      dark: monokai
    html-math-method: katex
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 250px

params:
  author: "Cole Rehbein"
  date_format: "MMM D, YYYY"

editor: visual
